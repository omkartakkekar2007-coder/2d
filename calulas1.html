<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Math Drop Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: black;
  font-family: "Courier New", monospace;
  color: #00ff66;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* GAME CARD */
.game-container {
  width: 460px;
  padding: 20px;
  border: 2px solid #00ff66;
  box-shadow: 0 0 25px #00ff66;
  background: rgba(0, 0, 0, 0.9);
  border-radius: 12px;
  text-align: center;
  z-index: 2;
}

/* HUD */
.hud {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 18px;
}

/* CANVAS */
canvas {
  display: block;
  background: black;
  border: 2px solid #00ff66;
  margin: auto;
}

/* INPUT */
input {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  font-size: 18px;
  background: black;
  color: #00ff66;
  border: 2px solid #00ff66;
  text-align: center;
  outline: none;
}

/* OVERLAYS */
.overlay {
  position: fixed;
  inset: 0;
  background: black;
  color: #00ff66;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
  text-align: center;
}

.overlay button {
  margin-top: 15px;
  padding: 12px 28px;
  font-size: 18px;
  background: black;
  color: #00ff66;
  border: 2px solid #00ff66;
  cursor: pointer;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen" class="overlay">
  <h1>🧮 MATH DROP</h1>
  <p>Solve the equations before they fall</p>
  <button onclick="startGame()">START GAME</button>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOverScreen" class="overlay hidden">
  <h1>GAME OVER</h1>
  <p>Score: <span id="finalScore">0</span></p>
  <button onclick="restartGame()">RESTART</button>
</div>

<div class="game-container">
  <div class="hud">
    <div>❤️ Lives: <span id="lives">3</span></div>
    <div>⭐ Score: <span id="score">0</span></div>
  </div>

  <canvas id="game" width="420" height="520"></canvas>

  <input
    type="text"
    id="answer"
    placeholder="Type answer & press Enter"
    disabled
    autocomplete="off"
  >
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const answerInput = document.getElementById("answer");

let lives = 3;
let score = 0;
let speed = 1.5;
let running = false;
let equation = null;

/* START GAME */
function startGame() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");

  lives = 3;
  score = 0;
  speed = 1.5;
  running = true;

  document.getElementById("lives").innerText = lives;
  document.getElementById("score").innerText = score;

  answerInput.disabled = false;
  answerInput.value = "";
  answerInput.focus();

  newEquation();
  requestAnimationFrame(gameLoop);
}

/* RESTART */
function restartGame() {
  startGame();
}

/* NEW EQUATION */
function newEquation() {
  let ops = ["+", "-", "*", "/"];
  let op = ops[Math.floor(Math.random() * ops.length)];

  let a, b, ans;

  if (op === "/") {
    ans = Math.floor(Math.random() * 9) + 1;
    b = Math.floor(Math.random() * 9) + 1;
    a = ans * b;
  } else {
    a = Math.floor(Math.random() * 10) + 1;
    b = Math.floor(Math.random() * 10) + 1;
    if (op === "+") ans = a + b;
    if (op === "-") ans = a - b;
    if (op === "*") ans = a * b;
  }

  equation = {
    text: `${a} ${op} ${b}`,
    answer: ans,
    x: Math.random() * 260 + 80,
    y: 0
  };
}

/* GAME LOOP */
function gameLoop() {
  if (!running) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff66";
  ctx.font = "26px Courier New";
  ctx.shadowColor = "#00ff66";
  ctx.shadowBlur = 8;

  ctx.fillText(equation.text, equation.x, equation.y);
  equation.y += speed;

  if (equation.y > canvas.height) {
    lives--;
    document.getElementById("lives").innerText = lives;
    newEquation();
  }

  if (lives <= 0) {
    running = false;
    answerInput.disabled = true;
    document.getElementById("finalScore").innerText = score;
    document.getElementById("gameOverScreen").classList.remove("hidden");
    return;
  }

  requestAnimationFrame(gameLoop);
}

/* INPUT */
answerInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && running) {
    if (parseInt(answerInput.value) === equation.answer) {
      score++;
      speed += 0.15;
      document.getElementById("score").innerText = score;
      newEquation();
    }
    answerInput.value = "";
  }
});
</script>

</body>
</html>
