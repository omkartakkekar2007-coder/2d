<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Drop Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">

  <h1>🧮 MATH DROP</h1>
  <p class="subtitle">Solve fast before it hits the ground</p>

  <div class="hud">
    <div>❤️ Lives: <span id="lives">3</span></div>
    <div>⭐ Score: <span id="score">0</span></div>
  </div>

  <canvas id="game" width="420" height="520"></canvas>

  <input 
    type="text" 
    id="answer" 
    placeholder="Type answer & press Enter"
    autocomplete="off"
  >

</div>

<script src="script.js"></script>
</body>
</html>
