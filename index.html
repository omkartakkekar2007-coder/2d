<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Drop Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Start Screen -->
<div id="startScreen" class="overlay">
  <h1>🧮 MATH DROP</h1>
  <p>Solve equations before they fall</p>
  <button onclick="startGame()">START GAME</button>
</div>

<!-- Game Over Screen -->
<div id="gameOverScreen" class="overlay hidden">
  <h1>GAME OVER</h1>
  <p>Your Score: <span id="finalScore">0</span></p>
  <button onclick="restartGame()">RESTART</button>
</div>

<div class="game-container">
  <div class="hud">
    <div>❤️ Lives: <span id="lives">3</span></div>
    <div>⭐ Score: <span id="score">0</span></div>
  </div>

  <canvas id="game" width="420" height="520"></canvas>
  <input type="text" id="answer" placeholder="Type answer & Enter" disabled>
</div>

<script src="script.js"></script>
</body>
</html>
